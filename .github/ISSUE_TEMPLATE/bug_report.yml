name: Bug report
description: Report a reproducible problem in Reviewer
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For platform security vulnerabilities, use private vulnerability reporting instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start Reviewer…\n2. Open…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Python and Node.js versions
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
